services:
  backend:
    image: cabreraevil/nestjs-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-api
    restart: no
    ports:
      - ${PORT-80}:80
      - ${TCP_PORT-4010}:4010
    env_file:
      - .env
    networks:
      - template_net
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16.2-bookworm
    container_name: template_postgres
    restart: no
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    volumes:
      - template_postgres:/var/lib/postgresql/data
    networks:
      - template_net

  redis:
    image: redis/redis-stack-server:7.4.0-rc2-x86_64
    container_name: template_redis
    restart: no
    environment:
      - REDIS_ARGS="--requirepass ${REDIS_PASSWORD:-admin}"
    volumes:
      - template_redis:/data
    networks:
      - template_net

networks:
  template_net:
    driver: bridge
    name: template_net

volumes:
  template_redis:
    driver: local
    name: template_redis
  template_postgres:
    driver: local
    name: template_postgres
